name: C# Code Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Dotnet Linting Check
        # --verify-no-changes makes the action exit with a non-zero code (fail) if lint errors exist
        run: dotnet format *.slnx analyzers --verify-no-changes --verbosity normal
